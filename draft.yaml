    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  JadwalPresensi:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Supporting Entities
  Pengaturan:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #
