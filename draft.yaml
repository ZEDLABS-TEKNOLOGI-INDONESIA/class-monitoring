models:
  # Wilayah Administratif
  Negara:
    id: uuid primary
    nama: string
    kode: string nullable
    phone_code: string unique
    bendera: string nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: Provinsi

  Provinsi:
    id: uuid primary
    negara_id: uuid foreign:negaras index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Negara
      hasMany: Kabupaten

  Kabupaten:
    id: uuid primary
    provinsi_id: uuid foreign:provinsis index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Provinsi
      hasMany: Kecamatan

  Kecamatan:
    id: uuid primary
    kabupaten_id: uuid foreign:kabupatens index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Kabupaten
      hasMany: Kelurahan

  Kelurahan:
    id: uuid primary
    kecamatan_id: uuid foreign:kecamatans index
    nama: string
    kode_pos: string nullable index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Kecamatan
      hasMany: #

  # Instansi Pendidikan
  Instansi:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  InstansiAsal:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Periodik
  TahunPelajaran:
    id: uuid primary
    nama: string
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  TahunPendaftaran:
    id: uuid primary
    nama: string
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  TahunAnggaran:
    id: uuid primary
    nama: string
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Primary Entities
  Jabatan:
    id: uuid primary
    nama: string
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Pegawai:
    id: uuid primary
    user_id: uuid foreign:users index
    instansi_id: uuid foreign:instansis index
    jabatan_id: uuid foreign:jabatans index nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Siswa:
    id: uuid primary
    user_id: uuid foreign:users index
    instansi_id: uuid foreign:instansis index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Jurusan:
    id: uuid primary
    nama: string
    deskripsi: text nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Kelas:
    id: uuid primary
    nama: string
    jurusan_id: uuid foreign:jurusans index nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Ekstrakurikuler:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  MataPelajaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Historical Entities
  # Akademik Entities
  GuruMataPelajaran:
    id: uuid primary
    guru_id: uuid foreign:pegawais index
    mata_pelajaran_id: uuid foreign:mata_pelajarans index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  GuruEkstrakurikuler:
    id: uuid primary
    guru_id: uuid foreign:pegawais index
    ekstrakurikuler_id: uuid foreign:ekstrakurikulers index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  KelasTahunPelajaran:
    id: uuid primary
    tahun_pelajaran_id: uuid foreign:tahun_pelajarans index
    kelas_id: uuid foreign:kelas index
    guru_kelas_id: uuid foreign:pegawais index nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  KelasSiswa:
    id: uuid primary
    kelas_tahun_pelajaran_id: uuid foreign:kelas_tahun_pelajarans index
    siswa_id: uuid foreign:siswas index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  JadwalPelajaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Pendaftaran Entities
  JadwalPendaftaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  JalurPendaftaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Presensi Entities
  JadwalPresensi:
    id: uuid primary
    nama: string
    hari: enum('senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu')
    jam_masuk: time nullable
    jam_keluar: time nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PresensiPegawai:
    id: uuid primary
    pegawai_id: uuid foreign:pegawais index
    jadwal_presensi_id: uuid foreign:jadwal_presensis index
    tanggal: date index
    jam_datang: time nullable
    jam_pulang: time nullable
    presensi_datang: enum('hadir', 'terlambat', 'cuti', 'libur', 'izin', 'sakit', 'alfa') default:'alfa'
    presensi_pulang: enum('pulang', 'mangkir') nullable
    catatan: text nullable
    lampiran: string nullable
    status_persetujuan: enum('menunggu', 'disetujui', 'ditolak') default:'menunggu' nullable
    alasan_ditolak: text nullable
    rentang_terlambat: integer nullable # perbandingan dengan jam_datang dengan jadwal_presensis.jam_masuk jika status presensi_datang adalah 'terlambat'.
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PresensiSiswa:
    id: uuid primary
    siswa_id: uuid foreign:siswas index
    jadwal_presensi_id: uuid foreign:jadwal_presensis index
    tanggal: date index
    jam_datang: time nullable
    jam_pulang: time nullable
    presensi_datang: enum('hadir', 'terlambat', 'cuti', 'libur', 'izin', 'sakit', 'alfa') default:'alfa'
    presensi_pulang: enum('pulang', 'mangkir') nullable
    catatan: text nullable
    lampiran: string nullable
    status_persetujuan: enum('menunggu', 'disetujui', 'ditolak') default:'menunggu' nullable
    alasan_ditolak: text nullable
    rentang_terlambat: integer nullable # perbandingan dengan jam_datang dengan jadwal_presensis.jam_masuk jika status presensi_datang adalah 'terlambat'.
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PengajuanTag:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Informasi:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Supporting Entities
  Pengaturan:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #
