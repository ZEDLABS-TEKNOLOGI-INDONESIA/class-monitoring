models:
  # Wilayah Administratif
  Provinsi:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      hasMany: Kabupaten

  Kabupaten:
    id: uuid primary
    provinsi_id: uuid foreign:provinsis index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Provinsi
      hasMany: Kecamatan

  Kecamatan:
    id: uuid primary
    kabupaten_id: uuid foreign:kabupatens index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Kabupaten
      hasMany: Kelurahan

  Kelurahan:
    id: uuid primary
    kecamatan_id: uuid foreign:kecamatans index
    nama: string
    kode_pos: string nullable index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: Kecamatan
      hasMany: #

  # Instansi Pendidikan
  Instansi:
    id: uuid primary
    nama: string
    nss: string nullable
    npsn: string nullable
    alamat: string nullable
    telepon: string nullable
    email: string nullable
    website: string nullable
    logo: string nullable
    logo_institusi: string nullable
    provinsi_id: uuid foreign:provinsis index nullable
    kabupaten_id: uuid foreign:kabupatens index nullable
    kecamatan_id: uuid foreign:kecamatans index nullable
    kelurahan_id: uuid foreign:kelurahans index nullable
    status: enum('aktif', 'non-aktif') default:'aktif'
    jenis: enum('negeri', 'swasta') default:'negeri'
    tipe: enum('paud','tk','sd','sltp','slta','pt')
    tahun_berdiri: date nullable
    akreditasi: enum('a', 'b', 'c', 'belum')
    akreditasi_tanggal: date nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  InstansiAsal:
    id: uuid primary
    nama: string
    nss: string nullable
    npsn: string nullable
    alamat: string nullable
    telepon: string nullable
    email: string nullable
    website: string nullable
    logo: string nullable
    logo_institusi: string nullable
    provinsi_id: uuid foreign:provinsis index nullable
    kabupaten_id: uuid foreign:kabupatens index nullable
    kecamatan_id: uuid foreign:kecamatans index nullable
    kelurahan_id: uuid foreign:kelurahans index nullable
    status: enum('aktif', 'non-aktif') default:'aktif'
    jenis: enum('negeri', 'swasta') default:'negeri'
    tipe: enum('paud','tk','sd','sltp','slta','pt')
    tahun_berdiri: date nullable
    akreditasi: enum('a', 'b', 'c', 'belum')
    akreditasi_tanggal: date nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Periodik
  Semester:
    id: uuid primary
    nama: string
    tanggal_mulai: date nullable
    tanggal_selesai: date nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  TahunPelajaran:
    id: uuid primary
    nama: string
    semester_id: uuid foreign:semesters index nullable
    tanggal_mulai: date nullable
    tanggal_selesai: date nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  TahunPendaftaran:
    id: uuid primary
    nama: string
    tanggal_mulai: date nullable
    tanggal_selesai: date nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  TahunAnggaran:
    id: uuid primary
    nama: string
    tanggal_mulai: date nullable
    tanggal_selesai: date nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Primary Entities
  Jabatan:
    id: uuid primary
    nama: string
    deskripsi: text nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Pegawai:
    id: uuid primary
    user_id: uuid foreign:users index
    instansi_id: uuid foreign:instansis index
    jabatan_id: uuid foreign:jabatans index nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Siswa:
    id: uuid primary
    user_id: uuid foreign:users index
    instansi_id: uuid foreign:instansis index
    nik: string nullable unique
    no_kk: string nullable
    nisn: string nullable unique
    nis: string nullable
    telepon: string nullable
    alamat: string nullable
    tempat_lahir: string nullable
    tanggal_lahir: date nullable
    jenis_kelamin: enum('pria', 'wanita') default:'pria'
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Jurusan:
    id: uuid primary
    nama: string
    deskripsi: text nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Kelas:
    id: uuid primary
    nama: string
    jurusan_id: uuid foreign:jurusans index nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  Ekstrakurikuler:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  MataPelajaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Historical Entities
  # Akademik Entities
  GuruMataPelajaran:
    id: uuid primary
    guru_id: uuid foreign:pegawais index
    mata_pelajaran_id: uuid foreign:mata_pelajarans index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  GuruEkstrakurikuler:
    id: uuid primary
    guru_id: uuid foreign:pegawais index
    ekstrakurikuler_id: uuid foreign:ekstrakurikulers index
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  KelasTahunPelajaran:
    id: uuid primary
    tahun_pelajaran_id: uuid foreign:tahun_pelajarans index
    kelas_id: uuid foreign:kelas index
    guru_kelas_id: uuid foreign:pegawais index nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  KelasSiswa:
    id: uuid primary
    kelas_tahun_pelajaran_id: uuid foreign:kelas_tahun_pelajarans index
    siswa_id: uuid foreign:siswas index
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  JadwalPelajaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Pendaftaran Entities
  JalurPendaftaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  JadwalPendaftaran:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Presensi Entities
  JadwalPresensi:
    id: uuid primary
    nama: string
    hari: enum('senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu')
    jam_masuk: time nullable
    jam_keluar: time nullable
    is_aktif: boolean
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PresensiPegawai:
    id: uuid primary
    pegawai_id: uuid foreign:pegawais index
    jadwal_presensi_id: uuid foreign:jadwal_presensis index
    tanggal: date index
    jam_datang: time nullable
    jam_pulang: time nullable
    presensi_datang: enum('hadir', 'terlambat', 'cuti', 'libur', 'izin', 'sakit', 'alfa') default:'alfa'
    presensi_pulang: enum('pulang', 'mangkir') nullable
    catatan: text nullable
    lampiran: string nullable
    status_persetujuan: enum('menunggu', 'disetujui', 'ditolak') default:'menunggu' nullable
    alasan_ditolak: text nullable
    rentang_terlambat: integer nullable # perbandingan dengan jam_datang dengan jadwal_presensis.jam_masuk jika status presensi_datang adalah 'terlambat'.
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PresensiSiswa:
    id: uuid primary
    siswa_id: uuid foreign:siswas index
    jadwal_presensi_id: uuid foreign:jadwal_presensis index
    tanggal: date index
    jam_datang: time nullable
    jam_pulang: time nullable
    presensi_datang: enum('hadir', 'terlambat', 'cuti', 'libur', 'izin', 'sakit', 'alfa') default:'alfa'
    presensi_pulang: enum('pulang', 'mangkir') nullable
    catatan: text nullable
    lampiran: string nullable
    status_persetujuan: enum('menunggu', 'disetujui', 'ditolak') default:'menunggu' nullable
    alasan_ditolak: text nullable
    rentang_terlambat: integer nullable # perbandingan dengan jam_datang dengan jadwal_presensis.jam_masuk jika status presensi_datang adalah 'terlambat'.
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  PengajuanTag:
    id: uuid primary
    kode_pengajuan: string unique
    kategori: enum('baru', 'rusak', 'hilang', 'lainnya')
    tanggal: datetime
    status: enum('menunggu', 'disetujui', 'ditolak', 'proses', 'selesai') default:menunggu
    catatan: text nullable
    biaya: decimal(15,2) nullable
    status_pembayaran: enum('lunas', 'belum') default:belum
    status_pengambilan: enum('sudah', 'belum') default:belum
    pegawai_id: uuid foreign:pegawais index nullable
    siswa_id: uuid foreign:siswas index nullable
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Konseling Entities
  Konseling:
    id: uuid primary
    siswa_id: uuid foreign:siswas index
    pegawai_id: uuid foreign:pegawais index
    tanggal: datetime
    topik: string
    catatan: text nullable
    hasil: text nullable
    tindak_lanjut: text nullable

  # Notification Entities
  Informasi:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #

  # Supporting Entities
  Pengaturan:
    id: uuid primary
    nama: string
    timestamps: true
    softDeletes: true
    relationships:
      belongsTo: #
      hasMany: #
